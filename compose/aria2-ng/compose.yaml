# FROM https://hub.docker.com/r/hurlenko/aria2-ariang

services:
  aria2-ng:
    container_name: aria2-ng
    image: hurlenko/aria2-ariang:latest
    restart: unless-stopped
    ports:
      - ${ARIA2_APP_PORT}:8080
      - ${ARIA2_RPC_PORT}:${ARIA2_RPC_PORT}
      - ${ARIA2_DHT_PORT}:${ARIA2_DHT_PORT}
      - ${ARIA2_DHT_PORT}:${ARIA2_DHT_PORT}/udp
    volumes:
      - ./data/conf:/aria2/conf
      - ${ARIA2_DOWNLOAD_DIR}:/aria2/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - RPC_SECRET=${ARIA2_RPC_SECRET}
      - ARIA2RPCPORT=${ARIA2_RPC_PORT}
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: 64M
networks: {}
