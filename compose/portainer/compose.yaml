# FROM https://docs.portainer.io/

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    ports:
      - 8000:8000
      - 9000:9000
      - 9443:9443 #HTTPS
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    network_mode: bridge
    deploy:
      resources:
        limits:
          memory: 32M
networks: {}
